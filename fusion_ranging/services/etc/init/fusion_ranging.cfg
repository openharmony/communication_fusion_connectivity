{
    "jobs" : [{
            "name" : "post-fs-data",
            "cmds" : [
                "mkdir /data/service/el1/public/fusion_ranging 0711 fusion_ranging fusion_ranging"
            ]
        }
    ],
    "services" : [{
            "name" : "fusion_ranging",
            "path" : ["/system/bin/sa_main", "/system/profile/fusion_ranging.json"],
            "uid" : "fusion_ranging",
            "gid" : ["fusion_ranging", "shell"],
            "ondemand" : true,
            "caps" : ["CAP_NET_ADMIN", "CAP_SYS_NICE", "CAP_WAKE_ALARM", "CAP_BLOCK_SUSPEND"],
            "secon" : "u:r:fusion_ranging:s0",
            "permission" : [
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_BUNDLE_RESOURCES",
                "ohos.permission.MANAGE_NEARLINK",
                "ohos.permission.ACCESS_NEARLINK",
                "ohos.permission.RUNNING_STATE_OBSERVER"
            ]
        }
    ]
}